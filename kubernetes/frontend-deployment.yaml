# -----------------------------------------------------------------------------
# Frontend Deployment
#
# Deploys the React frontend application.
# Kubernetes pulls the Docker image from Amazon ECR.
# -----------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  labels:
    app: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: ${FRONTEND_IMAGE}

          imagePullPolicy: Always

          ports:
            - containerPort: 3000